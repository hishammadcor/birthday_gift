<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Happy Birthday, Anan</title>
  <meta name="description" content="A birthday cake in a dark room, and one thing to do: blow. Your breath puts the candles out — and a rose blooms for Anan." />
  <meta name="theme-color" content="#0d0908" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="./app.css" />
</head>
<body>

  <!-- ===================================================================
       ACT 0 — the invitation. A heart beats in the dark; draw the bow and
       release to send Cupid's arrow into it. The strike opens the card and
       hands off to the cake. (Reimplemented dependency-free from the
       happy-birthday-tree reference; themed for the candlelit room.)
       =================================================================== -->
  <section class="hero" id="hero" aria-label="Draw the bow and release to begin">
    <div class="hero__bg" aria-hidden="true"></div>

    <p class="hero__eyebrow" id="heroEyebrow">a little something, for you</p>

    <!-- the target the arrow flies to -->
    <div class="targetWrap" aria-hidden="true">
      <div class="target" id="target">
        <span class="heart__glow" id="heartGlow" aria-hidden="true"></span>
        <span class="target__heart" id="targetHeart">
          <svg class="heart__svg" viewBox="0 0 100 92" aria-hidden="true">
            <defs>
              <radialGradient id="hg" cx="38%" cy="30%" r="80%">
                <stop offset="0%"  stop-color="#ffd9e4" />
                <stop offset="42%" stop-color="#ff6f97" />
                <stop offset="82%" stop-color="#d81e57" />
                <stop offset="100%" stop-color="#9d0f3e" />
              </radialGradient>
              <linearGradient id="hsheen" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"  stop-color="rgba(255,255,255,.85)" />
                <stop offset="34%" stop-color="rgba(255,255,255,0)" />
              </linearGradient>
            </defs>
            <path d="M50 86.5C26 68 10.5 53.6 10.5 34.6 10.5 20.4 21 11 33.2 11c8.6 0 14.2 4.7 16.8 11.4C52.6 15.7 58.2 11 66.8 11 79 11 89.5 20.4 89.5 34.6 89.5 53.6 74 68 50 86.5Z" fill="url(#hg)" />
            <path d="M50 86.5C26 68 10.5 53.6 10.5 34.6 10.5 20.4 21 11 33.2 11c8.6 0 14.2 4.7 16.8 11.4C52.6 15.7 58.2 11 66.8 11 79 11 89.5 20.4 89.5 34.6 89.5 53.6 74 68 50 86.5Z" fill="url(#hsheen)" opacity=".7" />
            <ellipse cx="34" cy="30" rx="8.5" ry="5.4" fill="#fff" opacity=".72" style="mix-blend-mode:screen" />
          </svg>
        </span>
      </div>
    </div>

    <!-- the bow + arrow rig — placed lower-left, rotated by JS to aim at the heart -->
    <div class="archery" id="archery" role="button" tabindex="0"
         aria-label="Draw the bow and release to send the arrow to the heart">

      <div class="aim" id="aim" aria-hidden="true"></div>

      <svg class="bow" id="bow" viewBox="0 0 460 300" aria-hidden="true">
        <defs>
          <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0"   stop-color="#4a2a1a" />
            <stop offset=".18" stop-color="#6b3f24" />
            <stop offset=".5"  stop-color="#8a5127" />
            <stop offset=".82" stop-color="#6b3f24" />
            <stop offset="1"   stop-color="#4a2a1a" />
          </linearGradient>
          <linearGradient id="limbHi" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="rgba(255,214,160,.8)" />
            <stop offset="1" stop-color="rgba(255,214,160,0)" />
          </linearGradient>
          <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2a1a10" />
            <stop offset=".5" stop-color="#5a3822" />
            <stop offset="1" stop-color="#2a1a10" />
          </linearGradient>
        </defs>
        <path class="bow__limb" d="M34 96 C 118 168, 168 240, 230 252 C 292 240, 342 168, 426 96"
              fill="none" stroke="url(#limb)" stroke-width="13" stroke-linecap="round" />
        <path class="bow__limbHi" d="M34 96 C 118 168, 168 240, 230 252 C 292 240, 342 168, 426 96"
              fill="none" stroke="url(#limbHi)" stroke-width="3" stroke-linecap="round" opacity=".7" />
        <path d="M34 96 C 22 82, 26 70, 40 66" fill="none" stroke="url(#limb)" stroke-width="8" stroke-linecap="round" />
        <path d="M426 96 C 438 82, 434 70, 420 66" fill="none" stroke="url(#limb)" stroke-width="8" stroke-linecap="round" />
        <rect x="216" y="206" width="28" height="70" rx="9" fill="url(#grip)" />
        <path d="M219 220h22 M219 236h22 M219 252h22" stroke="rgba(0,0,0,.35)" stroke-width="2" />
        <line class="bow__str" id="strL" x1="40" y1="70" x2="230" y2="96" stroke="#c7a884" stroke-width="2.2" stroke-linecap="round" />
        <line class="bow__str" id="strR" x1="420" y1="70" x2="230" y2="96" stroke="#c7a884" stroke-width="2.2" stroke-linecap="round" />
        <circle class="bow__serving" id="serving" cx="230" cy="96" r="4.5" fill="#8f6f4a" />
      </svg>

      <svg class="arrow" id="arrow" viewBox="0 0 64 220" aria-hidden="true">
        <defs>
          <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#4a2c14" />
            <stop offset=".5" stop-color="#8a5a2c" />
            <stop offset="1" stop-color="#3e2410" />
          </linearGradient>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe38c" />
            <stop offset=".45" stop-color="#f4a626" />
            <stop offset="1" stop-color="#a85f0e" />
          </linearGradient>
          <linearGradient id="feath" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ff7f9c" />
            <stop offset=".5" stop-color="#e6396a" />
            <stop offset="1" stop-color="#a8154a" />
          </linearGradient>
          <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#ffe0c4" />
          </linearGradient>
        </defs>
        <rect x="29.4" y="30" width="5.2" height="168" rx="2.6" fill="url(#shaft)" />
        <g class="arrow__wings">
          <path class="wingL" d="M31 30 C 10 16, 2 20, 4 34 C 12 30, 20 32, 31 40 Z" fill="url(#wing)" stroke="rgba(196,132,58,.72)" stroke-width="1.2"/>
          <path class="wingR" d="M33 30 C 54 16, 62 20, 60 34 C 52 30, 44 32, 33 40 Z" fill="url(#wing)" stroke="rgba(196,132,58,.72)" stroke-width="1.2"/>
        </g>
        <path class="arrow__head" d="M32 12 C 30 7, 22 6.5, 21.5 13 C 21 18, 27 22, 32 27 C 37 22, 43 18, 42.5 13 C 42 6.5, 34 7, 32 12 Z" fill="url(#gold)" stroke="#a5701a" stroke-width=".8" />
        <ellipse cx="27" cy="13" rx="2.6" ry="1.7" fill="#fff" opacity=".8" style="mix-blend-mode:screen" />
        <g class="arrow__fletch">
          <path d="M32 150 C 16 156, 10 178, 15 200 C 24 194, 30 184, 32 176 Z" fill="url(#feath)" />
          <path d="M32 150 C 48 156, 54 178, 49 200 C 40 194, 34 184, 32 176 Z" fill="url(#feath)" opacity=".92" />
          <path d="M28 160l4 3 M26 170l6 3 M25 180l7 3" stroke="rgba(130,12,48,.45)" stroke-width="1" />
          <path d="M36 160l-4 3 M38 170l-6 3 M39 180l-7 3" stroke="rgba(130,12,48,.45)" stroke-width="1" />
        </g>
        <path d="M29 200 L32 205 L35 200" fill="none" stroke="#c9a25a" stroke-width="2" stroke-linecap="round"/>
        <circle id="tip" cx="32" cy="9" r="0.6" fill="none" />
      </svg>
    </div>

    <p class="hero__hint" id="heroHint">pull &amp; release</p>

    <div class="hero__burst" id="heroBurst" aria-hidden="true"></div>
  </section>

  <!-- ===================================================================
       ACT 1 — the room. One canvas drives room, cake, candles, flames,
       smoke through a single rAF loop. Blow to put the candles out.
       =================================================================== -->
  <main class="stage" id="stage">

    <canvas id="scene" class="scene" role="img"
            aria-label="A birthday cake for Anan in a dark room with five lit candles"></canvas>

    <!-- the ask -->
    <p class="eyebrow" id="eyebrow">make a wish ya Anan</p>

    <!-- the payoff — [hidden] until the last candle is out -->
    <div class="msg" id="msg" hidden>
      <p class="msg__eyebrow" id="msgEyebrow">every candle, first try</p>
      <h1 class="msg__title" id="msgTitle">Happy Birthday</h1>
      <p class="msg__sub" id="msgSub">something's blooming for you…</p>
    </div>

    <!-- the control — mic is offered, never forced; hold-to-blow always works -->
    <div class="controls" id="controls">
      <button class="btn btn--mic" id="micBtn" type="button">
        <span class="btn__mic" aria-hidden="true"></span>
        <span id="micLabel">Use my breath</span>
      </button>
      <button class="btn btn--hold" id="holdBtn" type="button">or hold to blow</button>
      <p class="note" id="note">Your audio is analysed on-device and never leaves this page.</p>
    </div>

    <!-- live breath readout — shown only while the mic is actually listening -->
    <div class="meter" id="meter" hidden aria-hidden="true">
      <div class="meter__track"><div class="meter__fill" id="meterFill"></div></div>
      <p class="meter__label" id="meterLabel">listening…</p>
    </div>

    <!-- one polite channel for state changes -->
    <p class="sr-only" role="status" aria-live="polite" id="live"></p>
  </main>

  <!-- ===================================================================
       ACT 2 — the rose. Revealed once the candles are out. A single
       stem grows from the dark and a rose blooms while the song plays.
       =================================================================== -->
  <div class="rose-stage" id="roseStage" aria-hidden="true">
    <div class="vignette"></div>
    <div class="spotlight"></div>
    <div class="ambient-light" id="ambientLight"></div>

    <div class="rose-scene">
      <div class="rose-wrapper" id="roseWrapper">
        <div class="stem-group">
          <div class="stem" id="stem">
            <div class="stem-highlight"></div>
          </div>
          <div class="thorn thorn-1" id="thorn1"></div>
          <div class="thorn thorn-2" id="thorn2"></div>
          <div class="leaf leaf-left" id="leafLeft">
            <div class="leaf-vein"></div>
          </div>
          <div class="leaf leaf-right" id="leafRight">
            <div class="leaf-vein"></div>
          </div>
        </div>

        <div class="calyx" id="calyx"></div>

        <div class="rose-head" id="roseHead">
          <div class="rose-glow"></div>
          <div class="rose-glow-inner"></div>
        </div>
      </div>
    </div>

    <div class="end-text" id="endText">
      <p class="tagline" id="tagline">Here's to a year that bloom ya <span class="name">Anan</span></p>
      <span class="rose-emoji" aria-hidden="true">🌹</span>
    </div>

    <div id="fallingPetals"></div>
  </div>

  <!-- persists above both acts -->
  <button class="replay" id="replay" type="button" hidden>
    <span aria-hidden="true">↺</span> Again
  </button>

  <!-- the song — starts from 0:30 the instant the candles go out -->
  <audio id="song" src="Happy%20Birthday.mp3" preload="auto" playsinline></audio>

  <script type="module" src="./app.js"></script>
</body>
</html>
